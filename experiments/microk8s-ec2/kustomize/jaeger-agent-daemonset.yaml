apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: jaeger-agent
  labels:
    app: jaeger-agent
spec:
  selector:
    matchLabels:
      app: jaeger-agent
  template:
    metadata:
      labels:
        app: jaeger-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 5
      containers:
        - name: agent
          image: jaegertracing/jaeger-agent:latest
          imagePullPolicy: IfNotPresent
          args:
            - --reporter.grpc.host-port=jaeger:14250
            - --log-level=info
          ports:
            - name: compact
              containerPort: 6831
              hostPort: 6831
              protocol: UDP
            - name: binary
              containerPort: 6832
              hostPort: 6832
              protocol: UDP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
